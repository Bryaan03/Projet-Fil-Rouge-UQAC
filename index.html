<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Accueil</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="auth.css">
    <script src="supabaseClient.js" defer></script>
    <script src="auth.js" defer></script>
</head>

<body>
    <div class="auth-card">
        <h1 id="titre">Inscription</h1>
        <p id="description">Créez un compte pour accéder à vos conversations</p>

        <form id="auth-form">
            <div id="username-container" class="form-group">
                <input type="text" id="username" name="username" placeholder="Nom d'utilisateur" required>
            </div>

            <div class="form-group">
                <input type="email" id="email" name="email" placeholder="Adresse email" required>
            </div>

            <div class="form-group">
                <input type="password" id="mdp" name="mdp" placeholder="Mot de passe" required>
            </div>

            <div id="confirm-mdp-container" class="form-group">
                <input type="password" id="confirm-mdp" name="confirm-mdp" placeholder="Confirmer le mot de passe" required>
            </div>

            <div id="connexion-options" style="display: none;">
                <div class="options-row">
                    <label>
                        <input type="checkbox" name="souvenir">
                        Se souvenir de moi
                    </label>
                    <a href="#">Mot de passe oublié ?</a>
                </div>
            </div>

            <input type="submit" id="btn-submit" value="S'inscrire">
        </form>

        <p id="message"></p>

        <div class="toggle-section">
            <p id="toggle-text">Vous avez déjà un compte ?</p>
            <button type="button" id="btn-toggle">Se connecter</button>
        </div>
    </div>
</body>

</html>
