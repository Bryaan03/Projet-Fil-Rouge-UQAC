<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messagerie</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/conversation.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabaseClient.js" defer></script>
    <script src="../js/conversation.js" defer></script>
  </head>

  <body class="chat-page">
    <div class="chat-app-container">
      <!-- Gauche : Liste des discussions -->
      <aside class="chat-sidebar">
        <div class="chat-sidebar-header">
          <div class="chat-sidebar-top">
            <h2 class="chat-sidebar-title">Messages</h2>
            <div class="chat-sidebar-btns">
              <a
                href="contact.html"
                title="Nouveau message"
                class="chat-btn-action"
                >📝</a
              >
              <a
                href="parametre.html"
                title="Paramètres"
                class="chat-btn-action"
                >⚙️</a
              >
            </div>
          </div>
          <div class="chat-search-wrapper">
            <input
              type="text"
              id="search-conv"
              class="chat-search-input"
              placeholder="Rechercher"
              autocomplete="off"
            />
          </div>
        </div>

        <div class="chat-conversations-list" id="conversations-list"></div>
      </aside>

      <!-- Droite : Zone de discussion -->
      <main class="chat-main">
        <header class="chat-header" id="chat-header">
          <button type="button" id="btn-back-conversations" class="chat-back-mobile-btn">
            ← Messages
          </button>
          <div
            class="chat-header-profile"
            id="header-profile-trigger"
            title="Personnaliser ce contact (pour moi)"
          >
            <div
              class="chat-header-avatar-wrap"
              id="header-avatar-wrap"
              style="display: none"
            >
              <img
                id="chat-avatar"
                class="chat-header-avatar"
                src=""
                alt="Avatar"
              />
              <span class="chat-presence-dot"></span>
            </div>
            <div class="chat-header-name-row">
              <h3 id="chat-title" class="chat-header-title">
                Sélectionnez une conversation
              </h3>
              <span
                id="chat-edit-icon"
                class="chat-edit-hint"
                style="display: none"
                >✎</span
              >
            </div>
            <span id="chat-subtitle" class="chat-header-subtitle"></span>
          </div>
        </header>

        <div class="chat-messages-container" id="messages-container">
          <p class="chat-empty-messages">
            Veuillez sélectionner une conversation
          </p>
        </div>

        <!-- Barre de saisie iMessage avec bouton "+" -->
        <form class="chat-message-form" id="message-form" style="display: none">
          <div class="chat-plus-container">
            <button
              type="button"
              id="btn-attach"
              class="chat-plus-btn"
              title="Ajouter un média"
            >
              +
            </button>
            <div
              id="chat-attach-menu"
              class="chat-attach-menu"
              style="display: none"
            >
              <button type="button" id="menu-photo" class="chat-menu-item">
                📷 Photo / Vidéo
              </button>
              <button type="button" id="menu-doc" class="chat-menu-item">
                📎 Document
              </button>
              <button type="button" id="menu-gps" class="chat-menu-item">
                📍 Position GPS
              </button>
              <button type="button" id="menu-gif" class="chat-menu-item">
                🎞️ GIF animé
              </button>
            </div>
          </div>

          <div class="chat-input-pill" id="input-pill-container">
            <input
              type="text"
              id="message-input"
              class="chat-message-input"
              placeholder="Message"
              autocomplete="off"
            />
            <button
              type="button"
              id="btn-mic"
              class="chat-mic-btn"
              title="Maintenir pour enregistrer un vocal"
            >
              🎤
            </button>
            <button
              type="submit"
              id="btn-send"
              class="chat-send-btn"
              title="Envoyer"
              style="display: none"
            >
              ↑
            </button>
          </div>
        </form>
      </main>
    </div>

    <!-- Modale de personnalisation du contact -->
    <div
      id="custom-contact-modal"
      class="chat-modal-overlay"
      style="display: none"
    >
      <div class="chat-modal-card">
        <h4 class="chat-modal-title">Personnaliser le contact</h4>
        <p class="chat-modal-desc">Visible uniquement par vous</p>

        <div class="chat-modal-avatar-box">
          <img
            id="modal-contact-avatar"
            class="chat-modal-avatar"
            src=""
            alt="Aperçu"
          />
          <label for="modal-avatar-input" class="chat-modal-avatar-btn"
            >Choisir une photo</label
          >
          <input
            type="file"
            id="modal-avatar-input"
            class="chat-modal-file"
            accept="image/*"
          />
        </div>

        <form id="custom-contact-form">
          <div class="chat-modal-group">
            <label for="modal-contact-name" class="chat-modal-label"
              >Surnom / Nom affiché :</label
            >
            <input
              type="text"
              id="modal-contact-name"
              class="chat-modal-input"
              placeholder="Nom personnalisé"
              required
            />
          </div>

          <div class="chat-modal-actions">
            <button
              type="button"
              id="btn-reset-contact"
              class="chat-modal-btn chat-modal-btn-reset"
            >
              Réinitialiser
            </button>
            <button
              type="button"
              id="btn-cancel-modal"
              class="chat-modal-btn chat-modal-btn-cancel"
            >
              Annuler
            </button>
            <button type="submit" class="chat-modal-btn chat-modal-btn-save">
              OK
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modale de recherche de GIFs -->
    <div id="gif-modal" class="chat-modal-overlay" style="display: none">
      <div class="chat-modal-card chat-gif-card">
        <h4 class="chat-modal-title">Rechercher un GIF</h4>
        <div class="chat-modal-group">
          <input
            type="text"
            id="gif-search-input"
            class="chat-modal-input"
            placeholder="Rechercher sur Giphy..."
          />
        </div>
        <div id="gif-grid" class="chat-gif-grid"></div>
        <button
          type="button"
          id="btn-close-gif"
          class="chat-modal-btn chat-modal-btn-cancel"
          style="margin-top: 10px"
        >
          Fermer
        </button>
      </div>
    </div>
  </body>
</html>
